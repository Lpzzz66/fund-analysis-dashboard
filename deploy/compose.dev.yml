services:
  api:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - ../backend:/workspace/backend
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    command: >-
      sh -c "python -m pip install --no-cache-dir fastapi 'uvicorn[standard]' pytest httpx &&
      python -m uvicorn app.main:app --host $${APP_HOST} --port $${APP_PORT} --reload"
