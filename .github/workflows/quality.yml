name: Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Check formatting and imports
        run: |
          ruff check backend tools/valuation_inventory
          ruff format --check backend tools/valuation_inventory
      - name: Check types
        run: ty check backend/app
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Run inventory tool tests
        run: python -m pytest tools/valuation_inventory/tests -q
